<!DOCTYPE html>
<html>
<head>
  <title>Daily Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🌤️ Daily Dashboard</h1>

  <div class="weather">
    <h2>Weather</h2>
    <p>Location: Metro Manila</p>
    <p>Temperature: 30°C | Sunny</p>
  </div>

  <div class="todo">
    <h2>✅ To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Add a task...">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
